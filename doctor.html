<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Sekreter · Onam kayıtları</title><style>body{font:18px/1.6 system-ui,sans-serif;color:#142d3a;background:#f2f7f7;margin:0}main{max-width:1000px;margin:auto;padding:24px 16px}section,article{background:white;border:1px solid #c9dcdd;border-radius:18px;padding:22px;margin:18px 0}label{display:block;margin:12px 0 4px}input,button{font:inherit;padding:12px;border-radius:10px;box-sizing:border-box;max-width:100%}input{width:100%;border:2px solid #c9dcdd}button{background:#075e63;color:white;border:0;margin:12px 8px 0 0;cursor:pointer}button:disabled{opacity:.6}a{color:#075e63}a:focus-visible,input:focus-visible,button:focus-visible{outline:4px solid #ffbf47;outline-offset:3px}[hidden]{display:none!important}.qr{width:220px;max-width:100%}.qr svg{display:block;width:100%;height:auto}.patient-name{overflow-wrap:anywhere}@media print{body{background:#fff}main>a,h1,#status,#login,#toolbar,#list-title{display:none}article{display:none!important}article.print-target{display:block!important;break-inside:avoid;border:1px dashed #555;width:260px;padding:12px}article button,article a,.time{display:none}.qr{width:220px}}</style></head>
<body><main><a href="index.html">Hasta formuna dön</a><h1>Sekreter · Onam kayıtları</h1><p id="status" role="status" aria-live="polite"></p><section id="login"><h2>Kayıt ekranını aç</h2><p>Size verilen özel yönetim bağlantısını açın veya yönetim anahtarını girin. Hasta QR’ı bu ekranı açmaz.</p><form id="login-form"><label for="staff-key">Yönetim anahtarı</label><input id="staff-key" type="password" autocomplete="off" required><button type="submit">Kayıtları aç</button></form></section><div id="toolbar" hidden><button id="refresh">Yenile</button><button id="copy-link">Yönetim bağlantısını kopyala</button><button id="logout">Ekranı kapat</button><p>Bu yönetim bağlantısını yalnızca yetkili personelle paylaşın. Ekran 15 saniyede bir yenilenir.</p></div><h2 id="list-title" hidden>Son 100 onaylanan form</h2><div id="record-list"></div></main><script src="config.js?v=10"></script><script src="records.js?v=9"></script><script src="vendor/qrcode.js"></script><script src="qr-ui.js?v=9"></script><script src="doctor.js?v=9"></script></body></html>

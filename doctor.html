<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Doktor · Onam kayıtları</title>
<style>body{font:18px/1.6 system-ui,sans-serif;color:#142d3a;background:#f2f7f7;margin:0}main{max-width:900px;margin:auto;padding:24px 16px}section{background:white;border:1px solid #c9dcdd;border-radius:18px;padding:22px;margin:18px 0}label{display:block;margin:12px 0 4px}input,button{font:inherit;box-sizing:border-box;padding:12px;border-radius:10px;max-width:100%}input{width:100%;border:2px solid #c9dcdd}button{background:#075e63;color:white;border:0;margin:12px 8px 0 0;cursor:pointer}button:disabled{opacity:.6}a{color:#075e63}a:focus-visible,input:focus-visible,button:focus-visible{outline:4px solid #ffbf47;outline-offset:3px}[hidden]{display:none!important}dd{margin:0 0 14px;overflow-wrap:anywhere}dt{font-weight:bold}.form-text{white-space:pre-line}#records-list a{display:block;padding:10px;border-bottom:1px solid #c9dcdd}@media print{#login,#toolbar,#records-panel,main>a{display:none}section{border:0}body{background:white}}</style></head>
<body><main><a href="index.html">Hasta formuna dön</a><h1>Doktor · Onam kayıtları</h1><p id="doctor-status" role="status" aria-live="polite"></p>
<section id="login"><h2>Doktor girişi</h2><form id="login-form"><label for="email">E-posta</label><input id="email" type="email" autocomplete="username" required><label for="password">Şifre</label><input id="password" type="password" autocomplete="current-password" required><button id="login-button" type="submit">Giriş yap</button></form></section>
<div id="toolbar" hidden><button id="logout">Çıkış yap</button><button id="refresh-records">Kayıtları yenile</button></div>
<section id="records-panel" hidden><h2>Son kayıtlar</h2><div id="records-list"></div></section>
<section id="record-panel" hidden><h2>Hasta formu</h2><dl id="record-details"></dl><h2>Onaylanan form metni</h2><div id="record-form"></div><p>Bu kayıt hastanın beyanını içerir; resmi kimlik doğrulaması veya elektronik imza değildir.</p><button id="print-record">Yazdır</button></section>
</main><script src="config.js?v=8"></script><script src="records.js?v=8"></script><script src="doctor.js?v=8"></script></body></html>
